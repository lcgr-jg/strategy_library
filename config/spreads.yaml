# Spread definitions. expected_drivers are hypotheses, not measured betas.
# A leg uses tr_ticker when a dedicated total-return index resolved.
# tr_field is the fallback historical field on the price ticker.
# basis: total_return means the price ticker is already a performance index.
# alignment asia_to_us shifts Asian returns onto the previous US session.
# See src/strategy_library/data/calendar.py for why the shift points that way.

- id: us_cyc_def
  name: "S&P cyclicals vs defensives"
  long:
    - {ticker: "S5INDU Index", tr_field: TOT_RETURN_INDEX_GROSS_DVDS, currency: USD, region: US}
    - {ticker: "S5MATR Index", tr_field: TOT_RETURN_INDEX_GROSS_DVDS, currency: USD, region: US}
  short:
    - {ticker: "S5CONS Index", tr_field: TOT_RETURN_INDEX_GROSS_DVDS, currency: USD, region: US}
    - {ticker: "S5UTIL Index", tr_field: TOT_RETURN_INDEX_GROSS_DVDS, currency: USD, region: US}
  region: US
  currency: USD
  themes: [us_growth, cyclicals]
  expected_drivers: {us_10y: +, us_2s10s: +}
  sizing_default: beta_neutral
  vol_legs: {long: "VIX Index", short: null}
  alignment: native
  notes: "Equal-weight pair of sleeves. Industrials and materials versus staples and utilities. No dedicated sector total-return tickers resolved; the gross-dividend history field is the total-return series if it compounds."

